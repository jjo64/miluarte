          <h1>Nerea Lucas Pajares — Miluartedenara</h1>
          <p><strong>Artista Visual, Ilustradora y Diseñadora 3D</strong></p>
          <p>
            Me llamo Nerea Lucas Pajares, artísticamente conocida como Miluartedenara. Soy una artista visual multidisciplinar con Máster en Ilustración y Arte Digital de Trazos, Madrid. Combino técnicas tradicionales con herramientas digitales de última generación para crear narrativas visuales coherentes y espacios físicos impactantes. Especializada en ilustración digital, concept art, modelado en arcilla y joyería artesanal hecha a mano.
          </p>
          
          <h2>Habilidades y Disciplinas</h2>
          <ul>
            <li><strong>Ilustración Digital y Concept Art:</strong> Diseño de personajes, escenarios, worldbuilding, biblias visuales (Photoshop, Procreate).</li>
            <li><strong>3D y Stands:</strong> Diseño y visualización 3D para stands de ferias, renders de producto y planos técnicos de construcción (Blender, CAD).</li>
            <li><strong>Arte Tradicional y Artesanía:</strong> Escultura y modelado en arcilla, muñecas articuladas personalizadas y joyería artesanal hecha a mano.</li>
          </ul>

          <h2>Experiencia Destacada</h2>
          <ul>
            <li><strong>Ilustradora Creativa Freelance:</strong> Ilustración editorial, diseño de personajes y concept art (2024 - Actualidad).</li>
            <li><strong>Diseñadora Gráfica en Ledme Europa:</strong> Creación de catálogos, edición fotográfica, modelado 3D, diseño y mantenimiento web (2024 - Actualidad).</li>
            <li><strong>Ilustradora y Diseñadora en Sello musical Diggin':</strong> Portadas de álbumes, identidad visual y merchandising (2024 - Actualidad).</li>
            <li><strong>Diseñadora Gráfica Freelance:</strong> Renderizado 3D de stands para ferias y espacios expositivos (2019 - Actualidad).</li>
          </ul>

          <h2>Educación</h2>

            <li>Máster en Arte e Ilustración Digital — Trazos (2023 - 2024)</li>
            <li>Máster en Arte Digital — Trazos (2024)</li>
