          <h1>Nerea Lucas Pajares — Miluartedenara (naraneko)</h1>
          <p><strong>Artista Visual, Ilustradora y Diseñadora 3D</strong></p>
          <p>
            Me llamo Nerea Lucas Pajares (nacida en 1994, 32 años de edad), artísticamente conocida como Miluartedenara o <strong>naraneko</strong>. Soy una artista visual multidisciplinar de Madrid, España con una sólida trayectoria profesional y académica, incluyendo Másteres en Arte, Ilustración y Arte Digital de Trazos. Mi estilo firma principal es la serie <strong>Musae</strong>, caracterizado por la fusión de elementos pop, tipografía y naturaleza subvertida en un formato que equilibra lo tradicional y lo digital.
          </p>
          <p>
            Combino técnicas tradicionales (óleo, acrílico, escultura en arcilla, joyería hecha a mano) con herramientas digitales avanzadas (Photoshop, Procreate, Blender 3D, CAD) para construir narrativas visuales coherentes, concept art para videojuegos y sellos musicales, y stands comerciales tridimensionales fotorrealistas.
          </p>
          
          <h2>Habilidades y Disciplinas</h2>
          <ul>
            <li><strong>Ilustración Digital y Concept Art:</strong> Diseño de personajes, escenarios, worldbuilding, biblias visuales (Photoshop, Procreate, Clip Studio). Estilo principal de firma: Serie Musae.</li>
            <li><strong>3D y Stands:</strong> Diseño y visualización 3D para stands de ferias comerciales, renders fotorrealistas de producto y planos técnicos listos para producción (Blender, CAD).</li>
            <li><strong>Arte Tradicional y Artesanía:</strong> Escultura y modelado en arcilla, muñecas articuladas personalizadas (ball-jointed dolls) y joyería artesanal de diseño exclusivo hecha a mano.</li>
            <li><strong>Diseño Gráfico y Dirección de Arte:</strong> Logotipos, branding corporativo, catálogos comerciales y portadas de discos (directora de arte oficial del sello musical independiente Diggin' Records).</li>
          </ul>
